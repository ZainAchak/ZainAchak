name: Update profile metrics (stars, year activity, top langs)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'  # every 3 hours

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Compute metrics and update README
        uses: actions/github-script@v6
        with:
          script: |
            const username = 'zainachak';
            async function listAllRepos() {
              let page = 1;
              const all = [];
              while (true) {
                const res = await github.rest.repos.listForUser({
                  username,
                  per_page: 100,
                  page
                });
                if (!res.data || res.data.length === 0) break;
                all.push(...res.data);
                page++;
              }
              return all;
            }

            const repos = await listAllRepos();
            const publicRepos = repos.filter(r => !r.private && !r.archived && r.owner.login.toLowerCase() === username.toLowerCase());
            const totalStars = publicRepos.reduce((s, r) => s + (r.stargazers_count || 0), 0);

            // Languages come only from my own projects: forks are skipped,
            // and so is this profile repo.
            const ownRepos = publicRepos.filter(r => !r.fork && r.name.toLowerCase() !== username.toLowerCase());
            const langRepoCounts = {};
            const langBytes = {};
            for (const r of ownRepos) {
              try {
                const langsRes = await github.rest.repos.listLanguages({
                  owner: username,
                  repo: r.name
                });
                for (const [lang, bytes] of Object.entries(langsRes.data)) {
                  langRepoCounts[lang] = (langRepoCounts[lang] || 0) + 1;
                  langBytes[lang] = (langBytes[lang] || 0) + bytes;
                }
              } catch (e) {
                core.warning(`Failed to fetch languages for ${r.name}: ${e.message}`);
              }
            }
            // Rank by how many projects use a language, then by code size.
            const sortedLangs = Object.keys(langRepoCounts)
              .sort((a, b) => (langRepoCounts[b] - langRepoCounts[a]) || (langBytes[b] - langBytes[a]));

            const badgeText = s => encodeURIComponent(String(s).replace(/-/g, '--').replace(/_/g, '__'));
            const badge = (label, message, color, logo, logoColor = 'white') =>
              `<img src="https://img.shields.io/badge/${badgeText(label)}-${badgeText(message)}-${color}?style=for-the-badge` +
              (logo ? `&logo=${logo}&logoColor=${logoColor}` : '') + `" alt="${label}: ${message}" />`;
            const langStyles = {
              'Python': ['3776AB', 'python'],
              'JavaScript': ['F7DF1E', 'javascript', 'black'],
              'TypeScript': ['3178C6', 'typescript'],
              'Jupyter Notebook': ['F37626', 'jupyter'],
              'HTML': ['E34F26', 'html5'],
              'CSS': ['663399', 'css'],
              'C++': ['00599C', 'cplusplus'],
              'C': ['A8B9CC', 'c', 'black'],
              'Java': ['ED8B00', 'openjdk'],
              'Shell': ['4EAA25', 'gnubash'],
            };

            const now = new Date();
            const year = now.getUTCFullYear();
            const from = new Date(Date.UTC(year,0,1,0,0,0)).toISOString();
            const to = now.toISOString();

            const gql = `
              query ($login: String!, $from: DateTime!, $to: DateTime!) {
                user(login: $login) {
                  contributionsCollection(from: $from, to: $to) {
                    contributionCalendar {
                      totalContributions
                    }
                    totalCommitContributions
                    totalIssueContributions
                    totalPullRequestContributions
                    totalPullRequestReviewContributions
                    totalRepositoryContributions
                  }
                }
              }
            `;

            const gqlRes = await github.graphql(gql, { login: username, from, to });
            const coll = gqlRes.user.contributionsCollection || {};
            const calendarTotal = coll.contributionCalendar ? coll.contributionCalendar.totalContributions : 0;

            const totalStarsBlock = `<!-- TOTAL_STARS -->\n<p align="center">\n  ${badge('Total stars', totalStars.toLocaleString('en-US'), 'F59E0B', 'github')}\n  ${badge('Projects', ownRepos.length, '0EA5E9', 'git')}\n</p>\n<!-- TOTAL_STARS END -->`;
            const activityBadges = [
              badge(`${year} contributions`, calendarTotal.toLocaleString('en-US'), '22C55E', 'githubactions'),
              badge(`${year} public commits`, (coll.totalCommitContributions || 0).toLocaleString('en-US'), '6366F1', 'git'),
            ];
            const yearActivityBlock = `<!-- YEAR_ACTIVITY -->\n<p align="center">\n${activityBadges.map(b => `  ${b}`).join('\n')}\n</p>\n<!-- YEAR_ACTIVITY END -->`;
            const langBadges = sortedLangs.map(lang => {
              const [color, logo, logoColor] = langStyles[lang] || ['6B7280', ''];
              const n = langRepoCounts[lang];
              return `  ${badge(lang, `${n} ${n === 1 ? 'project' : 'projects'}`, color, logo, logoColor)}`;
            });
            const topLangsBlock = `<!-- TOP_LANGS -->\n<p align="center">\n${langBadges.length ? langBadges.join('\n') : '  None detected'}\n</p>\n<!-- TOP_LANGS END -->`;

            const readmePath = 'README.md';
            const readRes = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: readmePath
            });
            const sha = readRes.data.sha;
            const content = Buffer.from(readRes.data.content, 'base64').toString('utf8');

            let newContent = content;
            if (/<!-- TOTAL_STARS -->[\s\S]*?<!-- TOTAL_STARS END -->/.test(newContent)) {
              newContent = newContent.replace(/<!-- TOTAL_STARS -->[\s\S]*?<!-- TOTAL_STARS END -->/, totalStarsBlock);
            } else {
              newContent += `\n\n${totalStarsBlock}\n`;
            }

            if (/<!-- YEAR_ACTIVITY -->[\s\S]*?<!-- YEAR_ACTIVITY END -->/.test(newContent)) {
              newContent = newContent.replace(/<!-- YEAR_ACTIVITY -->[\s\S]*?<!-- YEAR_ACTIVITY END -->/, yearActivityBlock);
            } else {
              newContent += `\n\n${yearActivityBlock}\n`;
            }

            if (/<!-- TOP_LANGS -->[\s\S]*?<!-- TOP_LANGS END -->/.test(newContent)) {
              newContent = newContent.replace(/<!-- TOP_LANGS -->[\s\S]*?<!-- TOP_LANGS END -->/, topLangsBlock);
            } else {
              newContent += `\n\n${topLangsBlock}\n`;
            }

            if (newContent === content) {
              core.info('No changes to README.md (content identical).');
            } else {
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: readmePath,
                message: `chore: update profile metrics (stars=${totalStars}, year=${calendarTotal})`,
                content: Buffer.from(newContent, 'utf8').toString('base64'),
                sha
              });
              core.info('README.md updated successfully.');
            }
